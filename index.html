<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LingoBango — an APAC Counter-Strike communications atlas." />
    <title>LingoBango</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="splash-screen" id="intro" aria-label="LingoBango introduction">
        <a class="skip-button" href="#home">Skip intro</a>
        <div class="splash-screen__content" aria-hidden="true">
          <p class="splash-word splash-word--bingo">Bingo</p>
          <p class="splash-word splash-word--bango">Bango</p>
          <p class="splash-word splash-word--bango">Bongo</p>
          <p class="splash-word splash-word--bish">Bish</p>
          <p class="splash-word splash-word--bash">Bash</p>
          <p class="splash-word splash-word--bosh">Bosh</p>
          <p class="splash-phrase">Bingo Bango Bongo Bish Bash Bosh<span class="terminal-cursor">_</span></p>
        </div>
      </section>
      <section class="home-placeholder" id="home" aria-labelledby="home-title">
        <p class="home-placeholder__eyebrow">COMMUNICATIONS SYSTEM // READY</p>
        <h1 id="home-title">LINGOBANGO // COMMS ATLAS</h1>
        <p class="home-placeholder__copy">Callouts, tactical phrases, and regional language packs are coming online.</p>
      </section>
    </main>
  </body>
</html>
